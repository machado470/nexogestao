name: ci

on:
  push:
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexogestao?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-only-not-a-production-secret
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      GOOGLE_REDIRECT_URL: http://localhost:3000/auth/google/callback

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexogestao
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nexogestao"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable declared pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Install with immutable lockfile
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter ./apps/api prisma:generate

      - name: Prepare shared workspace packages
        run: pnpm prepare:workspace

      - name: Apply migrations to disposable CI database
        run: pnpm --filter ./apps/api exec prisma migrate deploy --schema ../../prisma/schema.prisma

      - name: Preflight
        run: pnpm prisma:check

      - name: Typecheck
        run: pnpm -r typecheck

      # Fast, tenant-focused regression signal before the broader suites.
      - name: Targeted tenant tests
        run: pnpm --filter ./apps/api test -- src/common/tenant-ops/tenant-ops.service.spec.ts

      # Runs the integration suites guarded by RUN_REAL_INTEGRATION against the disposable CI services.
      - name: Real multi-tenant isolation E2E
        env:
          RUN_REAL_INTEGRATION: "true"
        run: pnpm --filter ./apps/api test:integration:real

      # Outbox requires an isolated PostgreSQL database and has its own safety guard.
      - name: Real PostgreSQL Outbox integration
        run: bash scripts/run-outbox-integration.sh

      # Bootstrap first-admin requires a pristine database to prove
      # cross-instance serialization before any user exists.
      - name: Real PostgreSQL Bootstrap integration
        env:
          BOOTSTRAP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bootstrap_test?schema=public
        run: |
          postgres_container="$(docker ps --filter ancestor=postgres:15 --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_container"
          docker exec "$postgres_container" createdb -U postgres bootstrap_test

          DATABASE_URL="$BOOTSTRAP_TEST_DATABASE_URL" \
            pnpm --filter ./apps/api exec prisma migrate deploy \
              --schema ../../prisma/schema.prisma

          DATABASE_URL="$BOOTSTRAP_TEST_DATABASE_URL" \
          RUN_REAL_BOOTSTRAP_INTEGRATION=true \
            pnpm --filter ./apps/api exec jest \
              --config jest.config.js \
              --runInBand \
              test/integration/bootstrap-first-admin-postgres.integration.spec.ts

      # The API command covers every API test except the real integration suites already run above;
      # the web command covers the complete Vitest suite, avoiding duplicate integration execution.
      - name: Complete test suites
        run: |
          pnpm --filter ./apps/api test:unit
          pnpm --filter ./apps/web test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
